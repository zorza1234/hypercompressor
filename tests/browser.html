<!doctype html><html><head><meta charset="utf-8"><title>HyperCompressor local browser QA</title><style>body{font:16px Arial;background:#eee;padding:20px}iframe{width:390px;height:800px;border:1px solid #aaa}li{margin:9px 0}.pass{color:#185529}.fail{color:#b00}</style></head><body><h1>Local browser QA</h1><p id="status">Running real Canvas tests…</p><ol id="results"></ol><h2>390px responsive preview</h2><iframe title="Mobile preview" src="/"></iframe><script type="module">
import {loadImage,processImage} from '/assets/engine.js';
const results=document.querySelector('#results');let passed=0,failed=0;
async function check(name,fn){const li=document.createElement('li');try{const detail=await fn();li.textContent='PASS: '+name+' — '+(detail||'');li.className='pass';passed++;}catch(e){li.textContent='FAIL: '+name+' — '+e.message;li.className='fail';failed++;}results.append(li);}
const assert=(v,msg)=>{if(!v)throw new Error(msg);};
const canvas=document.createElement('canvas');canvas.width=1600;canvas.height=1000;const ctx=canvas.getContext('2d'), pixels=ctx.createImageData(1600,1000);let seed=42;for(let i=0;i<pixels.data.length;i+=4){seed=(seed*1664525+1013904223)>>>0;pixels.data[i]=seed%256;pixels.data[i+1]=(seed>>>8)%256;pixels.data[i+2]=(seed>>>16)%256;pixels.data[i+3]=255;}ctx.putImageData(pixels,0,0);
const blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',.95)),file=new File([blob],'noise.jpg',{type:'image/jpeg'}),image=await loadImage(file), defaults={format:'image/jpeg',kb:0,width:0,height:0,fit:'fit',quality:.85};
for(const kb of [20,50,100,200])await check(kb+' KB high-detail image',async()=>{const r=await processImage(image,file,{...defaults,kb});assert(r.blob.size<=kb*1000,'Exceeds limit');return r.blob.size+' bytes; '+r.width+' × '+r.height;});
for(const [name,kb,width,height]of [['BCS photo',100,300,300],['BCS signature',60,300,80],['SAT photo',50,420,540],['UNAM photo',200,480,600],['Lok Sewa',50,350,450],['JAMB',30,275,314],['Brazil',150,354,472],['NTA signature',30,0,0],['Indian postcard',200,400,600]])await check(name,async()=>{const r=await processImage(image,file,{...defaults,kb,width,height});assert(r.blob.size<=kb*1000,'Exceeds limit');if(width)assert(r.width===width&&r.height===height,'Wrong dimensions');return r.blob.size+' bytes; '+r.width+' × '+r.height;});
await check('Impossible exact frame reports error',async()=>{let rejected=false;try{await processImage(image,file,{...defaults,kb:1,width:1600,height:1000});}catch{rejected=true;}assert(rejected,'False success');});
await check('Broken image recovers with an error',async()=>{let rejected=false;try{await loadImage(new File(['broken'],'broken.jpg',{type:'image/jpeg'}));}catch{rejected=true;}assert(rejected,'Did not reject broken file');});
await check('PDF input rejected',async()=>{let rejected=false;try{await loadImage(new File(['pdf'],'file.pdf',{type:'application/pdf'}));}catch{rejected=true;}assert(rejected,'Accepted PDF');});
await check('WebP output matches requested MIME',async()=>{const r=await processImage(image,file,{...defaults,format:'image/webp',kb:100});assert(r.blob.type==='image/webp'&&r.blob.size<=100000,'Incorrect output');return r.blob.size+' bytes';});
await check('PNG exact dimensions',async()=>{const r=await processImage(image,file,{...defaults,format:'image/png',width:200,height:100});assert(r.blob.type==='image/png'&&r.width===200&&r.height===100,'Incorrect PNG');});
document.querySelector('#status').textContent=`${passed} passed; ${failed} failed.`;
</script></body></html>
