<!doctype html><html><head><meta charset="utf-8"><title>WhatsApp tool browser checks</title></head><body><h1>WhatsApp tool browser checks</h1><p id="status">Running…</p><ol id="results"></ol><iframe id="tool" title="390px mobile tool" width="390" height="850" src="/whatsapp-dp-maker"></iframe><script type="module">
const iframe=document.querySelector('#tool');await new Promise(r=>iframe.addEventListener('load',r));const win=iframe.contentWindow,doc=win.document,$=id=>doc.getElementById('dp-'+id);
const until=async fn=>{for(let i=0;i<600;i++){if(fn())return;await new Promise(r=>setTimeout(r,50));}throw new Error('Timed out');};
await until(()=>$('status').textContent.startsWith('Ready.'));
let passed=0,failed=0;const assert=(v,m)=>{if(!v)throw new Error(m)};
async function check(name,fn){const li=document.createElement('li');try{await fn();li.textContent='PASS '+name;passed++;}catch(e){li.textContent='FAIL '+name+': '+e.message;failed++;}document.querySelector('#results').append(li);}
const c=document.createElement('canvas');c.width=900;c.height=600;let ctx=c.getContext('2d');ctx.fillStyle='#408050';ctx.fillRect(0,0,900,600);ctx.fillStyle='red';ctx.fillRect(0,0,200,600);ctx.fillStyle='blue';ctx.fillRect(700,0,200,600);const blob=await new Promise(r=>c.toBlob(r,'image/png')),file=new File([blob],'test.png',{type:'image/png'});
async function ready(){await until(()=>!$('download').hidden);}
async function change(id,value){$(id).value=value;$(id).dispatchEvent(new win.Event('input',{bubbles:true}));await ready();}
async function output(){const b=await (await fetch($('download').href)).blob();return createImageBitmap(b);}
await check('390px layout has no horizontal overflow',()=>assert(doc.documentElement.scrollWidth<=390,'Page overflows'));
await check('drop input produces square JPEG',async()=>{const dt=new win.DataTransfer();dt.items.add(file);$('tool').dispatchEvent(new win.DragEvent('drop',{dataTransfer:dt,bubbles:true,cancelable:true}));await ready();const im=await output();assert(im.width===640&&im.height===640,'Wrong size');im.close();assert($('download').download==='whatsapp-dp.jpg','Wrong name');});
await check('circle is masked, square export is not',()=>{const p=$('circle').getContext('2d').getImageData(0,0,1,1).data;assert(p[3]===0,'Circle corner not transparent');assert($('preview').getContext('2d').getImageData(0,0,1,1).data[3]===255,'Square corner not filled');});
await check('solid fit keeps entire image',async()=>{await change('enhance','off');await change('fill','solid');await change('format','image/png');const p=$('preview').getContext('2d');assert(p.getImageData(320,10,1,1).data[0]===255,'Background is not white');assert(p.getImageData(5,320,1,1).data[0]>200,'Left edge missing');assert(p.getImageData(635,320,1,1).data[2]>200,'Right edge missing');});
await check('paste input is accepted',async()=>{const dt=new win.DataTransfer();dt.items.add(file);doc.dispatchEvent(new win.ClipboardEvent('paste',{clipboardData:dt,bubbles:true,cancelable:true}));await ready();assert($('source').textContent.includes('900 × 600'),'Paste failed');});
await check('crop, keyboard and zoom respond',async()=>{await change('mode','crop');$('preview').dispatchEvent(new win.KeyboardEvent('keydown',{key:'+',bubbles:true,cancelable:true}));await ready();assert(+$('zoom').value>1,'Zoom failed');$('preview').dispatchEvent(new win.KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true,cancelable:true}));await ready();});
// The browser pointer capture API requires real active pointers; test pinch math
// with a local no-op capture method, leaving production behavior untouched.
await check('two-pointer pinch increases zoom',async()=>{const el=$('preview'),capture=el.setPointerCapture;el.setPointerCapture=()=>{};const event=(type,id,x)=>el.dispatchEvent(new win.PointerEvent(type,{pointerId:id,clientX:x,clientY:200,bubbles:true,cancelable:true,pointerType:'touch'}));event('pointerdown',1,100);event('pointerdown',2,200);event('pointermove',2,250);event('pointerup',1,100);event('pointerup',2,250);el.setPointerCapture=capture;await ready();assert(+$('zoom').value>1.5,'Pinch failed');});
await check('before comparison leaves output settings intact',async()=>{await change('enhance','on');await change('compare','before');assert($('enhance').value==='on','Comparison disabled enhancement');await change('compare','after');});
await check('corrupt and oversize input errors recover',async()=>{for(const f of [new File(['bad'],'bad.png',{type:'image/png'}),new File([new Uint8Array(25*1024*1024+1)],'big.png',{type:'image/png'})]){const dt=new win.DataTransfer();dt.items.add(f);$('tool').dispatchEvent(new win.DragEvent('drop',{dataTransfer:dt,bubbles:true,cancelable:true}));await until(()=>!$('error').hidden);assert($('download').hidden,'Stale download');}const dt=new win.DataTransfer();dt.items.add(file);$('tool').dispatchEvent(new win.DragEvent('drop',{dataTransfer:dt,bubbles:true,cancelable:true}));await ready();});
await check('small target never changes dimensions',async()=>{await change('target','10');const im=await output();assert(im.width===640&&im.height===640,'Resized output');im.close();});
await check('remove clears export and preview',()=>{$('remove').click();assert($('result').hidden&&$('download').hidden&&!$('download').hasAttribute('href'),'Stale result');});
document.querySelector('#status').textContent=`${passed} passed; ${failed} failed`;
</script></body></html>
